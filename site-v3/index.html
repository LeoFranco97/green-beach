      content="Pousada e hotel numa rua paralela à orla, no centro de Itapema. Café da manhã incluso, piscina, e reserva feita direto com a recepção pelo WhatsApp."
    />
    <link rel="canonical" href="https://greenbeach.com.br/" />

    <meta name="theme-color" content="#3A452B" />
    <meta property="og:type" content="website" />

    <!--
      Cinco arquivos, o teto declarado na direção de arte. O itálico da
      Playfair existe por uma razão só: a terceira linha do display do hero,
      que é a assinatura tipográfica da página. Sem ele o gesto do Woolmers
      não acontece.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@400;600&display=swap"
    />

    <!--
      Marca o documento antes do primeiro quadro. O CSS usa .js para só
      esconder o que vai ser revelado depois se houver JavaScript para
      revelar: sem isso, script quebrado deixa a página em branco.
    -->
    <script>
      document.documentElement.classList.add('js')
    </script>
  </head>

  <body>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <div id="app"></div>
