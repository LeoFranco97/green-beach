<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Green Beach">
  <rect width="64" height="64" rx="14" fill="#242d21"/>
  <!-- Rosacea simplificada a partir da mandala da marca: quatro circulos
       entrelacados e uma estrela de oito pontas. Traco engrossado para
       sobreviver a 16px, onde o desenho original vira mancha. -->
  <g fill="none" stroke="#e5b64e" stroke-width="2.6" stroke-linejoin="round">
    <circle cx="32" cy="21.5" r="10.5"/>
    <circle cx="32" cy="42.5" r="10.5"/>
    <circle cx="21.5" cy="32" r="10.5"/>
    <circle cx="42.5" cy="32" r="10.5"/>
  </g>
  <path
    d="M32 12.5 38.2 25.8 51.5 32 38.2 38.2 32 51.5 25.8 38.2 12.5 32 25.8 25.8Z"
    fill="none" stroke="#f7ebd2" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
