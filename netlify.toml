# ---------------------------------------------------------------------------
# Publicacao do site da Pousada & Hotel Green Beach
# ---------------------------------------------------------------------------
# O site fica na pasta "site", nao na raiz do repositorio. Sem a base apontando
# para la a Netlify procura o package.json na raiz, nao acha, e a build falha
# antes de comecar.

[build]
  base    = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------
# Os arquivos gerados pelo Vite levam hash no nome: mudou o conteudo, muda o
# nome. Entao podem ficar um ano no cache do visitante sem risco de servir
# versao velha.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# As fotos tem nome estavel e nunca sao reescritas no mesmo caminho.
[[headers]]
  for = "/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O HTML e o oposto: precisa ser revalidado sempre, senao uma correcao de
# telefone ou de horario demora dias para chegar em quem ja visitou.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---------------------------------------------------------------------------
# Seguranca
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    X-Frame-Options        = "SAMEORIGIN"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=(), payment=()"
